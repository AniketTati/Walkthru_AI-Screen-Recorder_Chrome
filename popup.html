<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="video">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span>Video</span>
        </button>
        <button class="mode-btn" data-mode="photo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
          </svg>
          <span>Photo</span>
        </button>
      </div>
    </header>

    <!-- Camera Preview -->
    <div class="preview-section">
      <div class="preview-container" id="previewContainer">
        <video id="cameraPreview" autoplay muted playsinline></video>
        <div class="preview-placeholder" id="previewPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>No Camera</span>
        </div>
      </div>
    </div>

    <!-- Settings -->
    <div class="settings-section">
      <!-- Source -->
      <div class="setting-row">
        <div class="setting-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <select id="sourceSelect" class="setting-select">
          <option value="screen">Entire Screen</option>
          <option value="window">Window</option>
          <option value="tab" selected>Browser Tab</option>
        </select>
      </div>

      <!-- Camera -->
      <div class="setting-row">
        <div class="setting-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="23 7 16 12 23 17 23 7"></polygon>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
        </div>
        <select id="cameraSelect" class="setting-select">
          <option value="">No Camera</option>
        </select>
      </div>

      <!-- Microphone -->
      <div class="setting-row">
        <div class="setting-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </div>
        <select id="micSelect" class="setting-select">
          <option value="">No Microphone</option>
        </select>
      </div>

      <!-- Camera Mode (shown when camera selected) -->
      <div class="setting-row" id="cameraModeRow" style="display: none;">
        <div class="setting-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="10" r="3"></circle>
            <path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"></path>
          </svg>
        </div>
        <select id="cameraModeSelect" class="setting-select">
          <option value="live">Live Camera</option>
          <option value="photo">Use Photo</option>
        </select>
      </div>

      <!-- Profile Photo (shown when camera selected) -->
      <div class="photo-section" id="photoSection" style="display: none;">
        <div class="photo-header">
          <span class="photo-label">Profile Photo (fallback)</span>
        </div>
        <div class="photo-content">
          <div class="photo-preview" id="photoPreview">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="10" r="3"></circle>
              <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 0 1-6.25-3A6 6 0 0 1 12 14a6 6 0 0 1 6.25 3A8 8 0 0 1 12 20z"></path>
            </svg>
          </div>
          <div class="photo-actions">
            <label class="photo-upload-btn">
              <input type="file" id="photoUpload" accept="image/*" hidden>
              Upload
            </label>
            <span class="photo-or">or</span>
            <input type="text" id="photoUrl" class="photo-url-input" placeholder="Paste image URL">
          </div>
          <button id="removePhotoBtn" class="remove-photo-btn hidden">Remove</button>
        </div>
      </div>

    </div>

    <!-- Start Button -->
    <button id="startBtn" class="start-btn">
      Start Recording
    </button>

    <!-- Recording Status (shown when recording) -->
    <div id="recordingStatus" class="recording-status hidden">
      <div class="recording-indicator">
        <span class="recording-dot"></span>
        <span class="recording-text">Recording in progress...</span>
      </div>
      <div class="recording-time" id="recordingTime">00:00</div>
    </div>

    <!-- Error Message -->
    <div id="errorMsg" class="error-msg hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
