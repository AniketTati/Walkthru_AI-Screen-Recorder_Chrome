<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teleprompter - Screen Recorder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #text {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      font-size: 20px;
      line-height: 1.6;
      white-space: pre-wrap;
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <div id="text"></div>
  <script src="teleprompter.js"></script>
</body>
</html>
