<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Extension Icons</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px;
      text-align: center;
    }
    button {
      padding: 15px 30px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background: #0056b3;
    }
    .icons {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Screen Recorder Icons</h1>
  <p>Click the button below to generate and download the extension icons</p>
  <button onclick="generateIcons()">Generate Icons</button>
  
  <div class="icons">
    <canvas id="icon16" width="16" height="16"></canvas>
    <canvas id="icon48" width="48" height="48"></canvas>
    <canvas id="icon128" width="128" height="128"></canvas>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Background
      ctx.fillStyle = '#007aff';
      ctx.fillRect(0, 0, size, size);
      
      // Recording circle
      const centerX = size / 2;
      const centerY = size / 2;
      const radius = size * 0.3;
      
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.fill();
      
      // Inner dot
      ctx.fillStyle = '#ff3b30';
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 0.5, 0, 2 * Math.PI);
      ctx.fill();
    }

    function generateIcons() {
      const sizes = [
        { id: 'icon16', size: 16 },
        { id: 'icon48', size: 48 },
        { id: 'icon128', size: 128 }
      ];

      sizes.forEach(({ id, size }) => {
        const canvas = document.getElementById(id);
        drawIcon(canvas, size);
        
        // Download
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${id}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });

      alert('Icons generated and downloaded! Place them in the extension folder.');
    }

    // Draw icons on page load
    window.onload = () => {
      drawIcon(document.getElementById('icon16'), 16);
      drawIcon(document.getElementById('icon48'), 48);
      drawIcon(document.getElementById('icon128'), 128);
    };
  </script>
</body>
</html>
