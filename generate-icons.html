<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Extension Icons</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px;
      text-align: center;
    }
    button {
      padding: 15px 30px;
      background: #007aff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px;
    }
    button:hover {
      background: #0056b3;
    }
    .icons {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Screen Recorder Icons</h1>
  <p>Click the button below to generate and download the extension icons</p>
  <button>Generate Icons</button>
  
  <div class="icons">
    <canvas id="icon16" width="16" height="16"></canvas>
    <canvas id="icon48" width="48" height="48"></canvas>
    <canvas id="icon128" width="128" height="128"></canvas>
  </div>

  <script src="generate-icons-script.js"></script>
</body>
</html>
