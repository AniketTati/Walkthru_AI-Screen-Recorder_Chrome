<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripts - Screen Recorder</title>
  <link rel="stylesheet" href="scripts.css">
</head>
<body>
  <div class="container">
    <!-- List View -->
    <div id="listView" class="view">
      <header class="list-header">
        <div class="list-header-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
          <h1>Scripts</h1>
        </div>
        <button id="newScriptBtn" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          New Script
        </button>
      </header>
      <div id="scriptList" class="script-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
        </div>
        <p class="empty-title">No scripts yet</p>
        <p class="empty-sub">Create a script to use as a teleprompter during recording</p>
        <button id="emptyCreateBtn" class="btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Create Script
        </button>
      </div>
    </div>

    <!-- Editor View -->
    <div id="editorView" class="view hidden">
      <form id="scriptForm" class="editor-layout">
        <!-- Toolbar -->
        <div class="editor-toolbar">
          <a id="backBtn" href="#" class="toolbar-back" title="Back to scripts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
          </a>
          <div class="toolbar-sep"></div>
          <div class="toolbar-title-group">
            <span id="editorTitle" class="toolbar-subtitle">Edit script</span>
            <input type="text" id="scriptName" class="toolbar-name" placeholder="Untitled Script" required>
          </div>
          <div class="toolbar-sep"></div>
          <div class="toolbar-speed">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="toolbar-speed-icon">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
            <input type="range" id="speedSlider" min="60" max="200" step="10" value="120">
            <div class="speed-value">
              <input type="number" id="speedInput" min="60" max="200" step="1" value="120" aria-label="Speed in WPM">
              <span>WPM</span>
            </div>
          </div>
          <div class="toolbar-spacer"></div>
          <button type="button" id="addTimelineBtn" class="toolbar-btn" title="Add marker at cursor (Ctrl+Shift+M)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="16"/>
              <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            <span>Marker</span>
          </button>
          <button type="submit" id="saveBtn" class="toolbar-btn toolbar-btn-accent">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>Save</span>
          </button>
        </div>

        <!-- Script Panel -->
        <div class="editor-body">
          <div class="panel-bar">
            <span class="panel-label">SCRIPT</span>
            <span id="wordCount" class="panel-meta">0 words</span>
          </div>
          <div id="scriptContent" class="script-editor" contenteditable="true" data-placeholder="Paste your script from Google Doc, Word, etc. (Ctrl+V)"></div>
        </div>

        <!-- Timeline Panel -->
        <div id="timelineStrip" class="editor-timeline">
          <div class="panel-bar">
            <span class="panel-label">TIMELINE</span>
          </div>
          <div class="timeline-content">
            <div class="timeline-strip-track" id="timelineTrack">
              <div class="timeline-ruler" id="timelineRuler"></div>
              <div class="timeline-markers" id="timelineMarkers"></div>
            </div>
            <div class="timeline-strip-empty" id="timelineEmpty">No markers — place cursor in script and click "Marker" to add timeline sync points</div>
          </div>
        </div>
      </form>
    </div>

    <!-- Add Timeline Modal -->
    <div id="timelineModal" class="modal hidden">
      <div class="modal-content">
        <h3>Add Timeline Marker</h3>
        <p class="modal-hint">Show this position at:</p>
        <input type="text" id="timelineInput" placeholder="e.g. 3:00 or 1:30" maxlength="8">
        <div id="timelineError" class="error-msg hidden"></div>
        <div class="modal-actions">
          <button type="button" id="timelineCancel" class="btn-secondary">Cancel</button>
          <button type="button" id="timelineConfirm" class="btn-primary">Add Marker</button>
        </div>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
