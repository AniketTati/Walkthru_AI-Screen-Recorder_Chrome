<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripts - Screen Recorder</title>
  <link rel="stylesheet" href="scripts.css">
</head>
<body>
  <div class="container">
    <!-- List View -->
    <div id="listView" class="view">
      <header class="header">
        <h1>Scripts</h1>
        <button id="newScriptBtn" class="btn-primary">+ New script</button>
      </header>
      <div id="scriptList" class="script-list"></div>
      <div id="emptyState" class="empty-state hidden">
        <p>No scripts yet. Create one to get started.</p>
        <button id="emptyCreateBtn" class="btn-primary">Create script</button>
      </div>
    </div>

    <!-- Editor View -->
    <div id="editorView" class="view hidden">
      <header class="header">
        <a id="backBtn" href="#" class="back-link">← Back</a>
        <h2 id="editorTitle">New script</h2>
      </header>
      <form id="scriptForm" class="editor-form">
        <div class="form-row">
          <label for="scriptName">Name</label>
          <input type="text" id="scriptName" placeholder="e.g. Product Demo" required>
        </div>
        <div class="form-row">
          <label for="speedSlider">Scroll speed</label>
          <div class="speed-control">
            <div class="speed-slider-wrap">
              <input type="range" id="speedSlider" min="60" max="200" step="10" value="120">
              <div class="speed-labels">
                <span>Slow</span>
                <span>Medium</span>
                <span>Fast</span>
              </div>
            </div>
            <div class="speed-value">
              <input type="number" id="speedInput" min="60" max="200" step="1" value="120" aria-label="Speed in WPM">
              <span>WPM</span>
            </div>
          </div>
        </div>
        <div class="form-row script-row">
          <div class="script-row-header">
            <label for="scriptContent">Script</label>
            <button type="button" id="addTimelineBtn" class="btn-secondary btn-add-marker" title="Add timeline point at cursor (Ctrl+Shift+M)">
              <span class="btn-add-marker-icon">⊕</span> Add at cursor
            </button>
          </div>
          <div id="scriptContent" class="script-editor" contenteditable="true" data-placeholder="Paste your script from Google Doc, Word, etc. (Ctrl+V)"></div>
        </div>
        <div id="timelineStrip" class="timeline-strip">
          <div class="timeline-strip-label">Timeline</div>
          <div class="timeline-strip-track" id="timelineTrack">
            <div class="timeline-ruler" id="timelineRuler"></div>
            <div class="timeline-markers" id="timelineMarkers"></div>
          </div>
          <div class="timeline-strip-empty" id="timelineEmpty">No timeline points yet. Place cursor in script and click "Add at cursor".</div>
        </div>
        <div class="form-actions">
          <button type="submit" id="saveBtn" class="btn-primary">Save</button>
        </div>
      </form>
    </div>

    <!-- Add Timeline Modal -->
    <div id="timelineModal" class="modal hidden">
      <div class="modal-content">
        <h3>Add timeline point</h3>
        <p class="modal-hint">Show this position at:</p>
        <input type="text" id="timelineInput" placeholder="e.g. 3:00 or 1:30" maxlength="8">
        <div id="timelineError" class="error-msg hidden"></div>
        <div class="modal-actions">
          <button type="button" id="timelineCancel" class="btn-secondary">Cancel</button>
          <button type="button" id="timelineConfirm" class="btn-primary">Add</button>
        </div>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
